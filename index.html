<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOVerse</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>  
    <div class="header"><span class="x-word">X</span><span class="o-word">O</span>Verse</div>
    
    <div class="main">
        <div class="board-container">
            <div class="board">
                <div class="corner-top-left cell cell1" data-row="0" data-col="0"></div>
                <div class="top cell cell2" data-row="0" data-col="1"></div>
                <div class="corner-top-right cell cell3" data-row="0" data-col="2"></div>
                <div class="left cell cell4" data-row="1" data-col="0"></div>
                <div class="cell cell5" data-row="1" data-col="1"></div>
                <div class="right cell cell6" data-row="1" data-col="2"></div>
                <div class="corner-bottom-left cell cell7" data-row="2" data-col="0"></div>
                <div class="bottom cell cell8" data-row="2" data-col="1"></div>
                <div class="corner-bottom-right cell cell9" data-row="2" data-col="2"></div>
            </div>
        </div>
        <div class="game-details">
            <div class="win-lose-draw">Player1 / X turn</div>
            <div class="buttons">
                <button class="restart-btn">Restart Game</button>
                <button class="next-round-btn">Next Round</button>
            </div>
            <div class="round-result">
                <div class="player1">
                    <div>Player1</div>
                    <div>0</div>
                </div>
                <div class="draw">
                    <div>Draw</div>
                    <div>0</div>
                </div>
                <div class="player2">
                    <div>Player2</div>
                    <div>0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">DON'T LOSE YOUR SMILE! © 2026 Midhin Lal | Built with HTML, CSS, and JavaScript</div>

    <script src="js.js"></script>
</body>
</html>
